name: Apply Supabase migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: yydwfsmjuhenrbmxwkqw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link your Supabase project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply schema without copied historical transactions
        run: |
          data_migration="supabase/migrations/20260715133118_initial_data.sql"
          moved_migration="$RUNNER_TEMP/20260715133118_initial_data.sql"
          mv "$data_migration" "$moved_migration"
          trap 'mv "$moved_migration" "$data_migration"' EXIT
          supabase db push --include-all
          supabase migration repair 20260715133118 --status applied
